<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <link href="/styles.css" rel="stylesheet">
    <title>getall</title>

</head>
<body>
<header id="mainheader">
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #01935a;">
        <div class="container-fluid">

            <img th:src="@{/images/img.png}" class="navbar-image">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/attractions/Tivoli}">Find</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/attractions}">Attractions</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/login}">login/register</a></li>
                </ul>

                <!-- Søgebar -->
                <form class="d-flex mt-2 mt-lg-0" style="max-width: 350px;">
                    <div class="input-group">
                        <input class="form-control" type="search" id="searchBar" placeholder="Search" required>
                        <button id="searchBtn" class="btn btn-outline-success bg-white text-dark" type="button">Search</button>
                    </div>
                </form>
            </div>
        </div>
    </nav>
</header>
<main>

    <div class="container text-center my-4" style="max-width: 600px;">


        <h2 class="mb-4">Update Attraction Details</h2>

        <form th:action="@{/attractions/update/{name}(name=${item.name})}" method="post">
            <div class="mb-3">
                <input
                        name="newname"
                        th:value="${item.name}"
                        class="form-control mx-auto w-auto"
                        type="text">
            </div>
            <div class="mb-3">
                <input
                        name="newdescription"
                        th:value="${item.description}"
                        class="form-control mx-auto w-auto"
                        type="text">
            </div>
            <div class="mb-3">
                <input
                        name="newlongerdescription"
                        th:value="${item.longerdescription}"
                        class="form-control mx-auto w-auto"
                        type="text">
            </div>
            <div class="mb-3">
                <input
                        name="ticketPrice"
                        th:value="${item.ticketPrice}"
                        class="form-control mx-auto w-auto"
                        type="text">
            </div>


            <div class="d-flex flex-wrap justify-content-center gap-3 mb-4 mx-auto" style="max-width: 450px;">
                <div th:each="tag, status : ${tags}" class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           name="tags"
                           th:value="${tag}"
                           th:id="'tag-' + ${status.index}"
                           th:checked="${#lists.contains(item.tags, tag)}">

                    <label class="form-check-label"
                           th:for="'tag-' + ${status.index}"
                           th:text="${tag}">
                        Tag Name Placeholder
                    </label>
                </div>


            <div class="mb-3">
                <button class="btn btn-primary px-4" type="submit">Submit</button>
            </div>
        </form>
    </div>
</main>
<footer>
    <nav class="navbar navbar-expand-lg navbar-light footer" style="background-color: #01935a;">
        <div class="container-fluid">
            <footer>
                <p class="nav-link text-light text-center px-3">Author: William Victor</p>
                <p><a class="nav-link text-light text-center px-3" >William@example.com</a></p>
            </footer>
        </div>
    </nav>
</footer>
</body>
</html>
