<!DOCTYPE html>

<html lang="en" xmlns:th="http://thymeleaf.org" xmlns:grid-template-rows="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <link th:href="@{/styles.css}" rel="stylesheet">
    <title>My Webpage</title>

</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="mx-5 mt-3">
        <div class="row align-items-center">
            <div class="col-12 col-lg-6">
                <div class="d-flex align-items-baseline gap-2">
                    <h1 th:text="${attraction.name}" class="m-0">Tivoli</h1>

                    <h2 th:text="${attraction.description}" class="fs-4 text-secondary fw-normal m-0">Forlystelsespark</h2>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="text-lg pt-2 font-medium">
                    <h2 class="text-start text-lg-end">Andre Atrraktioner</h2>
                </div>
            </div>
        </div>
    </div>
    <div id ="mainstyle">
        <div class="soft-padding">

            <p th:text="${attraction.longerdescription}">
                Fallback text
            </p>

            <h3>Billetpris</h3>

            <p>
        <span id="priceDkk"
              th:text="${attraction.ticketPrice}">
            100
        </span>
                DKK
            </p>

            <button id="convertButton"
                    type="button"
                    class="btn btn-primary">
                Vis pris i euro
            </button>

            <p id="euroPrice"></p>

        </div>

        <img th:src="@{|/images/${attraction.name}.jpg|}" class="image">

        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col" class="w-50">Navn</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${attractions}">

                <td class="fw-bold">
                    <a th:href="@{/attractions/{name}(name=${item.name})}" th:text="${item.name}">Tivoli</a>
                </td>

            </tr>
            </tbody>
        </table>
    </div>
    <div class="container text-center my-4">
        <div id="resultsDisplay" class="p-3 border rounded bg-light mx-auto w-50" style="display: none;"></div>
    </div>
    <div class="soft-padding">
        <h2>Tags:</h2>
        <span class="black-text" th:each="tag : ${attraction.tags}" th:text="|• ${tag}|"  >Tag</span>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

<script>
    // Euro-konvertering
    const convertButton = document.getElementById("convertButton");
    const euroPrice = document.getElementById("euroPrice");

    if (convertButton) {
        convertButton.addEventListener("click", async function () {

            const priceDkk = parseFloat(
                document.getElementById("priceDkk").textContent
            );

            const response = await fetch(
                "https://api.frankfurter.dev/v1/latest?from=DKK&to=EUR"
            );

            const data = await response.json();

            const rate = data.rates.EUR;
            const priceInEuro = priceDkk * rate;

            euroPrice.textContent =
                priceInEuro.toFixed(2) + " EUR";
        });
    }
</script>

</body>
</html>
