<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
  <link href="/styles.css" rel="stylesheet">
  <title>add</title>

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>

  <div class="container text-center my-4" style="max-width: 600px;">


    <h2 class="mb-4">Add New Attraction</h2>

    <form th:action="@{/attractions/add}" method="post">
      <div class="mb-3">
        <input
                name="newname"
                placeholder="name"
                class="form-control mx-auto w-auto"
                type="text">
      </div>
      <div class="mb-3">
        <input
                name="newdescription"
                placeholder="description"
                class="form-control mx-auto w-auto"
                type="text">
      </div>
      <div class="mb-3">
        <input
                name="newlongerdescription"
                placeholder="longerdescription"
                class="form-control mx-auto w-auto"
                type="text">
      </div>
      <div class="mb-3">
        <input
                name="ticketPrice"
                placeholder="ticketPrice"
                class="form-control mx-auto w-auto"
                type="text">
      </div>


      <div class="d-flex flex-wrap justify-content-center gap-3 mb-4 mx-auto" style="max-width: 450px;">
        <div th:each="tag, status : ${tags}" class="form-check">
          <input class="form-check-input"
                 type="checkbox"
                 name="tags"
                 th:value="${tag}"
                 th:id="'tag-' + ${status.index}">

          <label class="form-check-label"
                 th:for="'tag-' + ${status.index}"
                 th:text="${tag}">
            Tag Name Placeholder
          </label>
        </div>


        <div class="mb-3">
          <button class="btn btn-primary px-4" type="submit">Submit</button>
        </div>
      </div>
    </form>

  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
