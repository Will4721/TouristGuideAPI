<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Tilføj Turistattraktion</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <link href="/styles.css" rel="stylesheet">

</head>

<body>
<header id="mainheader">
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #01935a;">
        <div class="container-fluid">

            <img th:src="@{/images/img.png}" class="navbar-image">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3"
                                            th:href="@{/about.html}">About</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3"
                                            th:href="@{/attractions/Tivoli}">Find</a></li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/attractions}">Attractions</a>
                    </li>
                    <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/login}">login/register</a>
                    </li>
                </ul>

                <!-- Søgebar -->
                <form class="d-flex mt-2 mt-lg-0" style="max-width: 350px;">
                    <div class="input-group">
                        <input class="form-control" type="search" id="searchBar" placeholder="Search" required>
                        <button id="searchBtn" class="btn btn-outline-success bg-white text-dark" type="button">Search
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </nav>
</header>


<h1>tilføj ny turistattraktion</h1>


<form th:action="@{/attractions/add}" method="post">

    <div class ="add-Input">
        <label for="id">ID:</label>
        <input type="number" id="id" name="id" required>

        <br>

        <label for="name">Navn:</label>
        <input type="text" id="name" name="name" required>

        <br>

        <label for="description">Beskrivelse:</label>
        <input type="text" id="description" name="description" required>

        <br>

        <label for="longerdescription">Lang beskrivelse:</label>
        <textarea id="longerdescription" name="longerdescription" rows="5" required> </textarea>

        <br>

        <label for="ticketPrice">Billetpris:</label>      <!-- step = 0,01 gør at man kan ændre prisen med 0,01 ad gangen -->
        <input type="number" id="ticketPrice" name="ticketPrice" min="0" step="0,01" required>

        <button type="submit">Tilføj turistattraktion</button>
    </div>
</form>


<footer>
    <nav class="navbar navbar-expand-lg navbar-light footer" style="background-color: #01935a;">
        <div class="container-fluid">
            <footer>
                <p class="nav-link text-light text-center px-3">Author: William Victor</p>
                <p><a class="nav-link text-light text-center px-3">William@example.com</a></p>
            </footer>
        </div>
    </nav>
</footer>
</body>


</html>
