<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<header id="mainheader" th:fragment="navbar">
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #01935a;">
    <div class="container-fluid">

      <img th:src="@{/images/img.png}" class="navbar-image">

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/}">Home</a></li>
          <li class="nav-item"><a class="nav-link text-light text-center px-3"
                                  th:href="@{/about}">About</a></li>
          <li class="nav-item"><a class="nav-link text-light text-center px-3"
                                  th:href="@{/attractions/Tivoli}">Find</a></li>
          <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/attractions}">Attractions</a>
          </li>
          <li class="nav-item"><a class="nav-link text-light text-center px-3" th:href="@{/login}">login/register</a>
          </li>
        </ul>

        <!-- Søgebar -->
        <form class="d-flex mt-2 mt-lg-0" style="max-width: 350px;">
          <div class="input-group">
            <input class="form-control" type="search" id="searchBar" placeholder="Search" required>
            <button id="searchBtn" class="btn btn-outline-success bg-white text-dark" type="button">Search
            </button>
          </div>
        </form>
      </div>
    </div>
  </nav>
  <script>
    (function() {
      function initSearch() {
        const searchBtn = document.getElementById("searchBtn");
        const searchBar = document.getElementById("searchBar");
        if (searchBtn && searchBar) {
          function doSearch(event) {
            if (event) event.preventDefault();
            const queryValue = searchBar.value.trim();
            if (queryValue) {
              window.location.href = `/attractions/${encodeURIComponent(queryValue)}`;
            }
          }
          searchBtn.addEventListener("click", doSearch);
          searchBar.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
              doSearch(event);
            }
          });
        }
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initSearch);
      } else {
        initSearch();
      }
    })();
  </script>
</header>
</body>
</html>
