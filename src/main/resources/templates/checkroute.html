<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <link href="/styles.css" rel="stylesheet">
    <title>Route</title>
    <link rel="icon" type="image/x-icon" href="/images/img.png">

</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main>
    <div class="mx-5 mt-3">
        <div class="row">
            <div class="col-12 col-lg-6">

                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col" class="w-50">Navn</th>
                        <th scope="col" class="w-50">Beskrivelse</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${attractions}">

                        <td class="fw-bold">
                            <a th:text="${item.name}">Tivoli</a>
                        </td>


                        <td class="text-muted">
                            <a class="linking"    th:text="${item.description}">Forlystelsespark i København</a>
                        </td>

                    </tbody>
                </table>
                <button onclick="document.location='add'">add</button>

            </div>

            <div class="col-12 col-lg-6">
                <div class="text-lg pt-2 font-medium">
                    <p>Make a route that passes by Tourist attractions just type in you start and end destination
                        &nbsp;</p>
                    <div>
                        <form action="/Route" method="post" class="login-form">
                            <div class="mb-3">
                                <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="FirstLocal" placeholder="First Loaction" type="text">
                            </div>
                            <div class="mb-3">
                                <input class="form-control mx-auto w-auto" name="LastLocal" placeholder="Last Location" type="text">
                            </div>
                            <button class="login-register" type="submit">Find route</button>
                        </form>
                    </div>
                    <div class="soft-padding">
                    <div th:each="place : ${result}">
                        <p th:text="${place}"></p>
                    </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
<script>
    const searchBtn = document.getElementById("searchBtn");
    const searchBar = document.getElementById("searchBar");

    if (searchBtn) {
        searchBtn.addEventListener("click", function(event) {
            event.preventDefault();
            const queryValue = searchBar.value.trim();
            if (!queryValue) return;

            // Sender brugeren til /attractions/Navn
            window.location.href = `/attractions/${encodeURIComponent(queryValue)}`;
        });
    }

</script>

</body>
</html>
