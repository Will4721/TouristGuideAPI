name: test on commit
on:
  push:
    branches:
      - '**'
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Hvis du bruger Maven til dine tests:
      # - name: Set up JDK 25
      #   uses: actions/setup-java@v4
      #   with:
      #     java-version: '25'
      #     distribution: 'temurin'
      # - name: Run tests with Maven
      #   run: mvn test
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
