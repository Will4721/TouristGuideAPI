name: test on commit
on:
  push:
    branches:
      - '**'
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Hvis du bruger Maven til dine tests:
      # - name: Set up JDK 17
      #   uses: actions/setup-java@v4
      #   with:
      #     java-version: '17'
      #     distribution: 'temurin'
      # - name: Run tests with Maven
      #   run: mvn test
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Opsæt den Java-version, dit projekt bruger (f.eks. 17 eller 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2024.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # Bruger den gratis Community JVM-linter og fejler ved mere end 0 problemer:
          args: --linter,jetbrains/qodana-jvm-community:2024.1,--fail-threshold,0
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # Får buildet til at fejle, hvis der er mere end 0 fundne problemer:
          fail-threshold: '0'
